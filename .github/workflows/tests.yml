name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: shiftflow_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  extensions: pdo_mysql

            - name: Install dependencies
              working-directory: backend
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Copy .env
              working-directory: backend
              run: cp .env.example .env

            - name: Generate app key
              working-directory: backend
              run: php artisan key:generate

            - name: Generate JWT secret
              working-directory: backend
              run: php artisan jwt:secret --force

            - name: Set test environment variables
              working-directory: backend
              run: |
                  cat > .env.testing << 'EOF'
                  APP_NAME=Laravel
                  APP_ENV=testing
                  APP_KEY=
                  APP_DEBUG=true
                  APP_URL=http://localhost:8000

                  DB_CONNECTION=mysql
                  DB_HOST=127.0.0.1
                  DB_PORT=3306
                  DB_DATABASE=shiftflow_test
                  DB_USERNAME=root
                  DB_PASSWORD=password

                  CACHE_DRIVER=array
                  SESSION_DRIVER=array
                  QUEUE_CONNECTION=sync

                  REDIS_HOST=127.0.0.1

                  JWT_SECRET=
                  EOF

                  APP_KEY=$(grep "^APP_KEY=" .env | cut -d '=' -f2-)
                  JWT=$(grep "^JWT_SECRET=" .env | cut -d '=' -f2-)
                  sed -i "s|^APP_KEY=.*|APP_KEY=$APP_KEY|" .env.testing
                  sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT|" .env.testing

            - name: Run migrations
              working-directory: backend
              run: php artisan migrate --force --env=testing

            - name: Run tests
              working-directory: backend
              run: php artisan test
