name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: shiftflow_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  extensions: pdo_mysql

            - name: Install dependencies
              working-directory: backend
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Copy .env
              working-directory: backend
              run: cp .env.example .env

            - name: Generate app key
              working-directory: backend
              run: php artisan key:generate

            - name: Generate JWT secret
              working-directory: backend
              run: php artisan jwt:secret --force

            - name: Set test environment variables
              working-directory: backend
              run: |
                  sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|" .env.testing
                  sed -i "s|^DB_USERNAME=.*|DB_USERNAME=root|" .env.testing
                  sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=password|" .env.testing
                  sed -i "s|^DB_PORT=.*|DB_PORT=3306|" .env.testing
                  JWT=$(grep "^JWT_SECRET=" .env | cut -d '=' -f2-)
                  sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT|" .env.testing
                  echo "REDIS_HOST=127.0.0.1" >> .env.testing
                  cat .env.testing | grep DB_

            - name: Run migrations
              working-directory: backend
              run: php artisan migrate --force --env=testing

            - name: Run tests
              working-directory: backend
              run: php artisan test
