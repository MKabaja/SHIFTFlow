services:
    app:
        build: ./backend
        container_name: shiftflow_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./backend:/var/www
        ports:
            - '8000:8000'
        depends_on:
            - db
            - redis
        networks:
            - shiftflow_network
        environment:
            DB_HOST: db
            DB_PORT: 3306
            DB_USERNAME: shiftflow_user
            DB_PASSWORD: ${DB_PASSWORD}

    db:
        image: mysql:8.0
        container_name: shiftflow_db
        restart: unless-stopped
        ports:
            - '3306:3306'
        environment:
            MYSQL_DATABASE: shiftflow_db
            MYSQL_USER: shiftflow_user
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        networks:
            - shiftflow_network

    redis:
        image: redis:7-alpine
        container_name: shiftflow_redis
        restart: unless-stopped
        ports:
            - ${FORWARD_REDIS_PORT:-6379}:6379
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            timeout: 5s
            retries: 3
        networks:
            - shiftflow_network

volumes:
    db_data:

networks:
    shiftflow_network:
        driver: bridge
